name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

env:
  MPLBACKEND: Agg
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
      - name: Lint and test
        run: |
          python -m ruff check synthts sweeps tests scripts
          python -m pytest

  minimum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install declared runtime minimums
        run: |
          python -m pip install torch==2.0.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==1.24.0 pandas==2.0.0 scipy==1.10.0 scikit-learn==1.3.0 matplotlib==3.7.0
          python -m pip install -e '.[dev]'
      - name: Test minimum runtime versions
        run: python -m pytest

  distribution:
    needs: [test, minimum]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and inspect distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
          python scripts/check_distribution.py dist
      - name: Install the wheel and test outside the checkout
        shell: bash
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install dist/*.whl
          python -m pip install pytest pytest-cov ipython nbformat pyyaml tqdm
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/scripts/smoke_installed.py" "$GITHUB_WORKSPACE/README.md"
          python -m pytest --import-mode=importlib "$GITHUB_WORKSPACE/tests" --ignore="$GITHUB_WORKSPACE/tests/test_sweeps.py"
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*

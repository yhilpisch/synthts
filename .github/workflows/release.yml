name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      target:
        description: Package index
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  metadata:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: Require complete publication metadata and matching tag
        env:
          PRODUCTION: ${{ github.event_name == 'push' || inputs.target == 'pypi' }}
        run: |
          python scripts/check_distribution.py dist --publication
          if [ "$PRODUCTION" = 'true' ]; then
            test "$GITHUB_REF_TYPE" = 'tag'
            python -c "import runpy, os; version = runpy.run_path('synthts/_version.py')['__version__']; assert os.environ['GITHUB_REF_NAME'] == 'v' + version"
          fi

  testpypi:
    needs: metadata
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    needs: metadata
    if: github.event_name == 'push' || inputs.target == 'pypi'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

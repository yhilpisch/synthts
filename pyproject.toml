[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "synthts"
dynamic = ["version"]
description = "GAN-based synthetic financial return sequences and diagnostics"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Dr. Yves J. Hilpisch", email = "team@tpq.io"}]
keywords = ["synthetic-data", "time-series", "GAN", "finance", "pytorch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "torch>=2.0,<3.0",
]

[project.optional-dependencies]
sweeps = ["tqdm>=4.66", "pyyaml>=6.0"]
notebooks = ["ipython>=8", "nbformat>=5.7", "ipykernel>=6", "pyyaml>=6.0"]
dev = [
    "pytest>=7", "pytest-cov>=4", "ruff>=0.9", "build>=1.2", "twine>=6",
    "tqdm>=4.66", "pyyaml>=6", "ipython>=8", "nbformat>=5.7", "ipykernel>=6",
]

[project.urls]
Homepage = "https://tpq.io"
Source = "https://github.com/yhilpisch/synthts"
Issues = "https://github.com/yhilpisch/synthts/issues"

[tool.setuptools]
packages = ["synthts"]
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "synthts._version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 80
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "E501"]

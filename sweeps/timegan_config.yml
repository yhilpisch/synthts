# TimeGAN sweep configuration — temporal-dependence follow-up.

symbol: GLD
seed: 100
seq_len: 63

n_jobs: 3
torch_threads: 1
max_trials: 24
out_dir: sweeps/results
export_best: sweeps/timegan_best.yml
export_on_complete: true
task_order: random
task_order_seed: null

n_eval: 100

input_dim: 1
output_dim: 1
num_layers: 1
gamma: 1.0
recon_weight: 10.0

# Checkpoint scoring
checkpoint_interval: 200

# LR scheduling
lr_schedule: cosine

# Observation discriminator
obs_disc_channels: 32
obs_disc_layers: 2
obs_adv_weight: 1.0

# Modular financial loss weights
mean_weight: 1.0
std_weight: 1.0
central_quantile_weight: 1.0
tail_quantile_weight: 2.0
acf_weight: 1.0
abs_acf_weight: 2.0
squared_acf_weight: 3.0
terminal_quantile_weight: 3.0
drawdown_quantile_weight: 3.0

# Latent activation
latent_activation: layernorm

embedding_epochs: 500
supervisor_epochs: 500

grid_keys:
  - hidden_units_values
  - latent_dim_values
  - noise_dim_values
  - batch_size_values
  - lr_values
  - supervisor_weight_values
  - moment_weight_values
  - stat_weight_values
  - stat_max_lag_values
  - joint_epochs_values

hidden_units_values: [128]
latent_dim_values: [24, 32]
noise_dim_values: [32]
batch_size_values: [128]
lr_values: [0.0003, 0.0005]
supervisor_weight_values: [50.0, 100.0]
moment_weight_values: [50.0]
stat_weight_values: [10.0, 25.0]
stat_max_lag_values: [10, 20]
joint_epochs_values: [2000]
